name: Napravi aplikaciju

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pripremi Android projekat
        run: |
          flutter create --org com.prvavest --project-name prvavest --platforms android .
          flutter pub add http cached_network_image flutter_widget_from_html_core shared_preferences url_launcher webview_flutter
          flutter pub add --dev flutter_launcher_icons
          # Dozvola za internet (potrebna da bi aplikacija preuzimala vesti)
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $MANIFEST
          # Ime aplikacije ispod ikonice na telefonu
          sed -i 's#android:label="prvavest"#android:label="Prva Vest"#' $MANIFEST

      - name: Napravi ikonicu
        run: dart run flutter_launcher_icons

      - name: Proveri kod
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Broj verzije raste sam sa svakom izgradnjom (Google Play
      # odbija fajl čiji broj nije veći od prethodnog).
      - name: Napravi APK i AAB (za Google Play)
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Potpiši APK i AAB stalnim ključem
        env:
          KLJUC: ${{ secrets.KLJUC }}
          LOZINKA: ${{ secrets.LOZINKA }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -z "$KLJUC" ]; then
            echo "Ključ nije podešen na GitHubu, APK ostaje sa probnim potpisom."
            exit 0
          fi
          echo "$KLJUC" | base64 -d > kljuc.jks
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks kljuc.jks --ks-key-alias prvavest \
            --ks-pass env:LOZINKA --key-pass env:LOZINKA "$APK"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          # AAB za Google Play: skidamo probni potpis i potpisujemo našim ključem
          AAB=build/app/outputs/bundle/release/app-release.aab
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore kljuc.jks -storepass:env LOZINKA -keypass:env LOZINKA \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" prvavest
          jarsigner -verify "$AAB" | tail -1
          rm -f kljuc.jks

      - uses: actions/upload-artifact@v4
        with:
          name: prva-vest-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prva-vest-aab-za-google-play
          path: build/app/outputs/bundle/release/app-release.aab
